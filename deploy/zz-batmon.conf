# KickAss Battery Monitor - proxies plain http://batmon.pj/ (port 80) to
# the dashboard service on port 5000, so the port doesn't need to be
# typed. Only matches this hostname (server_name) - the default gl.conf
# server block still handles everything else (admin UI, console.gl-inet.com,
# bare IP), so this cannot interfere with the existing GL.iNet UI.
#
# Filename MUST sort after "gl.conf" (hence "zz-" prefix, not "batmon.conf")
# - nginx's conf.d/*.conf glob loads files in lexicographic order, and
# when two server blocks share a `listen` port with neither marked
# `default_server`, the FIRST one loaded wins that role. Confirmed the
# hard way 2026-09-18: with a plain "batmon.conf" (sorts before "gl.conf"),
# this block silently became the default for ALL of port 80, including
# bare-IP admin UI access, breaking it - not just adding batmon.pj on top.
#
# Install: copy to /etc/nginx/conf.d/zz-batmon.conf on the router, then
# `nginx -t && /etc/init.d/nginx restart` (NOT `reload` - confirmed
# 2026-09-17 that reload can leave the old routing active even though
# `nginx -T` shows the new config parsed correctly).
#
# Deliberately NOT extended to also cover Tailscale's MagicDNS name
# (tried 2026-09-30, reverted) - adding a second, longer server_name
# value hit nginx's server_names_hash_bucket_size limit, and fixing that
# needs its own directive added carefully. Quinn preferred to just use
# the Tailscale IP:port directly for remote access instead, partly to
# keep this router reachable on plain port 80 remotely (its own admin
# UI) without adding any risk to that. Revisit only if asked again.
server {
    listen 80;
    listen [::]:80;
    server_name batmon.pj;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
