; KickAss Battery Monitor - ESP32 BLE bridge
; Many travel/OpenWrt routers have no usable native USB Bluetooth path,
; so this ESP32 does the BLE work instead and pushes decoded readings to
; the dashboard server over WiFi (see ../ingest_poller.py and this
; folder's own README for the full story).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; min_spiffs.csv gives two ~1.875MB OTA app slots (app0/app1) instead of
; one single ~3MB slot (the earlier huge_app.csv) - this firmware has no
; filesystem to speak of (no SPIFFS/LittleFS use - see config.h), so
; trading most of that spare space for OTA support is a clean win.
; Current usage is ~1.15MB, comfortably under each slot's ~1.875MB even
; after ArduinoOTA's own footprint - default.csv's smaller ~1.25MB slots
; would have been too tight for that headroom.
board_build.partitions = min_spiffs.csv
lib_deps =
	h2zero/NimBLE-Arduino@^2.2.1
	bblanchon/ArduinoJson@^7.2.1
build_flags =
	-DCORE_DEBUG_LEVEL=3

; Wireless firmware updates, once this OTA-enabled build is on the device
; via this one USB flash - after that, `pio run -e esp32dev_ota -t
; upload` pushes new firmware over WiFi instead. auth_pass must match
; OTA_PASSWORD in config.h.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
; Example only - change to your ESP32's actual IP (check your router's
; DHCP leases, or set a static/reserved one for it).
upload_port = 10.12.1.1
upload_flags =
	--auth=CHANGE_ME_OTA_PASSWORD
